# pipeline configuration
# Override any of those on the command line with --config key=value

## input/output
samples_sheet: "samples.tsv" # TSV with columns 'sample' (sample name) and 'fastq' (path)

outdir: "pipeline-out" # output directory

## resources
threads: 16

## QC (00-QC)
skip_host_removal: false # runs right after Chopper filtering
host_index:
  "" # hostile reference index name (`hostile index list`) or path to a
  # custom index; empty = hostile's own default human reference
chopper_min_quality: 12
chopper_min_length: 1000

## assembly (01-LongAssemblies)
## Options: metaflye | nanomdbg | myloasm
assemblers: ["myloasm"]

## Flye- specific options
flye_read_error:
  "" # leave empty for flye's default, might consider nudgeing down for very high-accuracy models (like 0.02)
  # <- check how it affects strainy (might give cleaner separation between close strains)
# both used to control memory/ runtime on very large metagenomes or coverage (~100x) only works when both are set.
flye_asm_coverage: "" # 30-50 (help says 40x coverage is enough)
flye_genome_size: "" # a rough TOTAL estimate for the whole community

## Myloasm-specific options
myloasm_quality_value_cutoff: "" # default: 90. Minimum read accuracy (%) required for a read to be used at all.
myloasm_bloom_filter_size: "" # adjust for large coverage/ genome size
myloasm_dereplication_ani: "" # default- 99. Raising makes assembly more fragmented but only throws away contigs which are nearlt identical
myloasm_dereplication_length: "" # deafult 500000 - protects larger near-complete contigs from being marked as alternates (basically - only apply the above to contigs shorter than this value)

## polishing (02-Polishing)
medaka_model: "r1041_e82_400bps_sup_v4.2.0" # must match the Dorado basecalling model; list available: medaka tools list_models
skip_medaka: false
## binning (03-LongBins)
semibin_env:
  "human_gut" # SemiBin2 pretrained environment model
  # -- options: human_gut dog_gut ocean soil cat_gut human_oral mouse_gut pig_gut built_environment wastewater chicken_caecum global
use_comebin: false

## bin refinement (DAS_Tool)
dastool_score_threshold: 0.5 # 0-1 lower- more bins, higher- stricter, fewer but cleaner bins

## bin QC (04-BinQC, final output in top-level Final-bins/)
## checkm2_db / gunc_db / gtdbtk_data_path default to download_databases.sh's
checkm2_db: "~/databases/checkm2/CheckM2_database/uniref100.KO.1.dmnd"
gunc_db: "~/databases/gunc/gunc_db_progenomes2.1.dmnd" # path to GUNC .dmnd database
gtdbtk_data_path: "~/databases/gtdbtk" # GTDB-Tk dir
gtdbtk_pplacer_cpus: 16  # keeping this below threads avoids OOM errors
# quality filters to make it into Final-bins/ at all
min_completeness: 50
max_contamination: 10
## MIMAG high-quality draft status (Bowers et al. 2017): >90% complete, <5%
## contaminated, 5S+16S+23S rRNA all present (barrnap), >=18 tRNAs (tRNAscan-SE).
mimag_min_completeness: 90
mimag_max_contamination: 5
mimag_min_trna: 18

## strain phasing (05-StrainPhasing, Track B)
## Off by default. Check if works with all assemblers.
run_strain_phasing: false

## conda environments
main_env: "../../environment.yml"
checkm2_env: "../../environment.checkm2.yml"
comebin_env: "../../environment.comebin.yml"
